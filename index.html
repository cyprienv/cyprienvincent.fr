<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyprien Vincent</title>
  <style>
    :root{
      --bg: #06080d;
      --bg-2: #0a0d12;
      --nav-bg: #f0f0f0;
      --nav-text: #111111;
      --text: #f5f5f5;
      --muted: #d9d9d9;
      --panel: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.12);
      --shadow: rgba(0,0,0,0.28);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }

    body {
      position: relative;
      background:
        linear-gradient(180deg, rgba(0,0,0,0.18), rgba(0,0,0,0.18)),
        #05070b;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100vh;
      background: #05070b;
      overflow: hidden;
    }

    .topbar {
      position: absolute;
      top: 28px;
      right: 38px;
      width: min(630px, calc(100% - 48px));
      background: var(--nav-bg);
      border-radius: 12px;
      box-shadow: 0 10px 22px rgba(0,0,0,0.18);
      padding: 16px 22px;
      z-index: 10;
    }

    .nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 28px;
      flex-wrap: wrap;
    }

    .nav a {
      text-decoration: none;
      color: var(--nav-text);
      font-size: 1.05rem;
      line-height: 1;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .hero {
      position: absolute;
      left: 28px;
      bottom: 28px;
      width: calc(100% - 80px);
      z-index: 2;
    }

    .subtitle {
      margin: 0 0 18px 0;
      color: rgba(255,255,255,0.95);
      font-size: clamp(1.2rem, 1.7vw, 2rem);
      font-weight: 300;
      letter-spacing: 0.01em;
    }

    .title-line {
      position: relative;
      display: inline-block;
      max-width: 100%;
    }

    .name {
      margin: 0;
      font-size: clamp(4rem, 8vw, 11rem);
      line-height: 0.9;
      letter-spacing: -0.075em;
      font-weight: 500;
      color: #f3f3f3;
      white-space: nowrap;
    }

    .capture-badge {
      position: absolute;
      right: 8px;
      bottom: 18px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.82);
      font-size: 0.76rem;
      padding: 6px 12px;
      border-radius: 999px;
      backdrop-filter: blur(4px);
      white-space: nowrap;
    }

    .image-panel {
      position: absolute;
      right: 110px;
      bottom: 58px;
      width: min(380px, 30vw);
      min-width: 220px;
      aspect-ratio: 0.8;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 40px var(--shadow);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      z-index: 1;
    }

    .image-panel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(1) contrast(1.05) brightness(0.9);
    }

    .secondary-image {
      position: absolute;
      right: 30px;
      bottom: 38px;
      width: 150px;
      height: 180px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 16px 28px rgba(0,0,0,0.2);
      z-index: 2;
    }

    .secondary-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(1) contrast(1.1);
    }

    .socials {
      position: absolute;
      right: 28px;
      bottom: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 5;
    }

    .social {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.8);
      font-size: 10px;
      font-weight: 700;
    }

    @media (max-width: 980px) {
      .image-panel {
        display: none;
      }

      .secondary-image {
        display: none;
      }

      .hero {
        width: calc(100% - 36px);
        left: 18px;
        bottom: 26px;
      }

      .name {
        white-space: normal;
      }

      .capture-badge {
        position: static;
        display: inline-flex;
        margin-top: 10px;
      }

      .title-line {
        display: block;
      }
    }

    @media (max-width: 640px) {
      .topbar {
        right: 16px;
        left: 16px;
        width: auto;
      }

      .nav {
        gap: 14px 18px;
      }

      .nav a {
        font-size: 0.95rem;
      }

      .subtitle {
        font-size: 1.12rem;
      }

      .name {
        font-size: clamp(2.8rem, 16vw, 5rem);
      }

      .socials {
        right: 18px;
        bottom: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <nav class="nav" aria-label="Navigation principale">
        <a href="#">Home</a>
        <a href="#">Projects</a>
        <a href="#">Concerts</a>
        <a href="#">Gallery</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <div class="image-panel">
      <img src="media/Home/portrait.jpg" alt="Portrait de Cyprien Vincent" />
    </div>

    <div class="secondary-image">
      <img src="media/Home/detail.jpg" alt="Détail visuel" />
    </div>

    <main class="hero">
      <p class="subtitle">Photographe, Vidéaste et directeur artistique</p>

      <div class="title-line">
        <h1 class="name">Cyprien Vincent</h1>
        <span class="capture-badge">Capture d'écran</span>
      </div>
    </main>

    <div class="socials" aria-label="Réseaux sociaux">
      <div class="social">◌</div>
      <div class="social">◎</div>
      <div class="social">◍</div>
      <div class="social">◐</div>
    </div>
  </div>
</body>
</html>
