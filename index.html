<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Cyprien Vincent — Portfolio</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000; }
    body { font-family: Arial, sans-serif; }
    .home-hero {
      position: relative;
      width: 100%;
      min-height: 100svh;
      overflow: hidden;
      background: #000 url("./media/home_B1_fond.jpg") center / cover no-repeat;
    }
    .home-hero__video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .home-hero__video--mobile { display: none; }
    @media (max-width: 767px) {
      .home-hero { background-image: url("./media/home_B1_fond-tel.jpg"); }
      .home-hero__video--desktop { display: none; }
      .home-hero__video--mobile { display: block; }
    }
    @media (prefers-reduced-motion: reduce) {
      .home-hero__video { visibility: hidden; }
    }
  </style>
</head>
<body>
  <main>
    <section class="home-hero" aria-label="Accueil">
      <video
        class="home-hero__video home-hero__video--desktop"
        src="./media/home_B1_fond-pc-mov.mp4"
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
        aria-hidden="true"
      ></video>
      <video
        class="home-hero__video home-hero__video--mobile"
        src="./media/home_B1_fond-tel-mov.mp4"
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
        aria-hidden="true"
      ></video>
    </section>
  </main>
</body>
</html>
